<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Planner Presentation Daily — Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F0E3; --ink:#1a1a1a; --muted:#6b6658; --card:#ffffff; --line:#e2ddcc;
  --red:#E62B00; --yellow:#F0C419; --purple:#9F84FF; --ok:#1f9d55;
  --slotbg:rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1c1b18;--ink:#f1eee4;--muted:#a8a293;--card:#26241f;--line:#3a372f;--slotbg:rgba(255,255,255,.05)}
}
:root[data-theme="dark"]{--bg:#1c1b18;--ink:#f1eee4;--muted:#a8a293;--card:#26241f;--line:#3a372f;--slotbg:rgba(255,255,255,.05)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",Arial,sans-serif;font-size:14px;line-height:1.45}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--red);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
header .sp{flex:1}
header label{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
header input[type=date]{font:inherit;padding:6px 8px;border-radius:6px;border:0}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
.btn.main{background:#111;color:#fff}
.btn.main:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor;padding:7px 12px;font-size:12px}
.btn:focus-visible,.slot:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.hint{max-width:1200px;margin:16px auto 0;padding:0 20px;color:var(--muted);font-size:13px}
.hint b{color:var(--ink)}
main{max-width:1200px;margin:0 auto;padding:16px 20px 60px;display:grid;gap:22px}
.slide-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.slide-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.slide-head .no{font-weight:800;color:var(--red)}
.slide-head .nm{font-weight:700}
.stage{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;background-size:100% 100%;border-radius:4px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.el{position:absolute;white-space:pre-line;overflow:hidden;color:#000}
.slot{position:absolute;border:2px dashed #b9b3a0;background:var(--slotbg);display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;color:#6b6658;text-align:center;font-size:1.1cqw;font-weight:600;transition:border-color .12s}
.slot .n{font-size:2.2cqw;font-weight:800;color:#9a937d}
.slot.active{border-color:var(--red);border-style:solid;background:rgba(230,43,0,.07)}
.slot.active .n{color:var(--red)}
.slot.filled{border:0;background:transparent}
.slot img{width:100%;height:100%;object-fit:contain;display:block}
.stage.stretch .slot img{object-fit:fill}
.slot .x{position:absolute;top:4px;right:4px;background:#111;color:#fff;border:0;border-radius:50%;width:22px;height:22px;font-size:13px;line-height:22px;cursor:pointer;display:none}
.slot.filled:hover .x{display:block}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:12px}
.field label{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;margin-bottom:6px;gap:8px}
.field textarea{width:100%;min-height:110px;font:inherit;font-size:13px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.ai{font:inherit;font-size:12px;font-weight:700;border:0;border-radius:6px;padding:5px 10px;background:var(--purple);color:#fff;cursor:pointer}
.ai:disabled{opacity:.55;cursor:wait}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Planner Presentation Daily</h1>
  <span class="sp"></span>
  <label>Tanggal <input type="date" id="tgl"></label>
  <label><input type="checkbox" id="stretch"> Gambar full (stretch)</label>
  <button class="btn ghost" id="reset">Kosongkan</button>
  <button class="btn main" id="gen">Generate PPT</button>
</header>
<p class="hint"><b>Cara pakai:</b> screenshot dashboard → <b>Ctrl+V</b>. Gambar masuk ke kotak yang merah, lalu otomatis pindah ke kotak berikutnya. Klik kotak mana saja untuk memilih tujuan paste, atau drag &amp; drop file ke kotaknya.</p>
<main id="app"></main>
<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast"></div>

const FIELDS = {
 s2noteA:{slide:2,label:"Note Daily Proses Yesterday",ph:"Contoh: Progres kemarin 96,5% dari target, B3 sempat delay 2 jam…",slots:["s2a"],
   ask:"Tulis 1-2 kalimat catatan singkat dari data Daily Proses KEMARIN di gambar ini (achievement vs target, kendala/delay per batch kalau ada)."},
 s2noteB:{slide:2,label:"Note Daily Proses Today",ph:"Contoh: Progres hari ini baru 34,5%, B2-B4 masih berjalan…",slots:["s2b"],
   ask:"Tulis 1-2 kalimat catatan singkat dari data Daily Proses HARI INI di gambar ini (progres vs target, batch yang masih berjalan/kosong)."},
 s3note:{slide:3,label:"Early warning (bawah gambar)",ph:"Contoh: Plan besok baru 43,6 CBM, B2–B4 masih kosong…",slots:["s3"],
   ask:"Tulis 1–2 kalimat early warning dari data plan besok di dashboard ini (CBM plan vs target per batch, batch yang masih kosong/kurang)."},
 s3panel:{slide:3,label:"Panel kanan",ph:"- Total plan …\n- Kota tujuan …",slots:["s3"],
   ask:"Buat ringkasan planning besok maksimal 5 poin: total CBM & Case ID plan, pembagian shift, CBM per batch vs target, kota tujuan, dan risiko."},

   ask:"Dari tabel list plan loading ini, ringkas maksimal 6 poin pendek: jumlah LC, total CBM plan, sebaran per batch/jam, carrier dominan, jalur tujuan utama, catatan penting."},
 s5note:{slide:5,label:"Early warning (bawah gambar)",ph:"Contoh: Backlog aging 7 up 152,4 CBM…",slots:["s5a","s5b"],
   ask:"Tulis 1–2 kalimat early warning soal backlog outstanding (aging 7 up, belum plan, store prioritas)."},

   ask:"Buat highlight maksimal 6 poin: total backlog, sudah vs belum plan, aging 7 up, allocation unsuccessful, store prioritas teratas, area storing dengan backlog terbesar."},

const state = {imgs:{}, text:{}, active:null};
const SLOT_ORDER = SLIDES.flatMap(s=>s.els.filter(e=>e.t==="img").map(e=>e.slot));
const SLOT_EL = {}; SLIDES.forEach(s=>s.els.forEach(e=>{ if(e.t==="img") SLOT_EL[e.slot]=e; }));

const BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
function fmtDate(v){ if(!v) return ""; const [y,m,d]=v.split("-").map(Number); return `${d} ${BULAN[m-1]} ${y}`; }
const tgl=document.getElementById("tgl");
(()=>{const n=new Date();tgl.value=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`})();

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2200);}
const pc=(v,b)=>(v/b*100)+"%";

function render(){
  const app=document.getElementById("app"); app.innerHTML="";
  SLIDES.forEach(s=>{
    const wrap=document.createElement("section"); wrap.className="slide-wrap";
    wrap.innerHTML=`<div class="slide-head"><span class="no">Slide ${s.no}</span><span class="nm">${s.name}</span></div>`;
    const st=document.createElement("div"); st.className="stage"+(document.getElementById("stretch").checked?" stretch":"");
    st.style.backgroundImage=`url(${ASSET[s.bg]})`;
    s.els.forEach(e=>{
      if(e.t==="logo"){const i=document.createElement("img");i.src=ASSET.logo;i.alt="AZKO";Object.assign(i.style,{position:"absolute",left:pc(e.x,BW),top:pc(e.y,BH),width:pc(e.w,BW),height:pc(e.h,BH)});st.appendChild(i);}
      else if(e.t==="rect"||e.t==="panel"){const d=document.createElement("div");d.className="el";Object.assign(d.style,{left:pc(e.x,BW),top:pc(e.y,BH),width:pc(e.w,BW),height:pc(e.h,BH),background:"#"+e.fill,border:e.line?`1px solid #${e.line}`:"none",borderRadius:e.t==="panel"?"1.1cqw":"0",boxShadow:e.t==="panel"?"0 .3cqw .6cqw rgba(0,0,0,.25)":"none"});st.appendChild(d);}
      else if(e.t==="line"){const d=document.createElement("div");d.className="el";const hz=e.y1===e.y2;Object.assign(d.style,{left:pc(e.x1,BW),top:pc(e.y1,BH),width:hz?pc(e.x2-e.x1,BW):"0",height:hz?"0":pc(e.y2-e.y1,BH),[hz?"borderTop":"borderLeft"]:`${e.dash?"2px dotted":"1px solid"} #${e.color}`});st.appendChild(d);}
      else if(e.t==="text"){const d=document.createElement("div");d.className="el";const txt=e.field?(e.field==="date"?fmtDate(tgl.value):(state.text[e.field]||"")):e.text;d.textContent=txt;d.dataset.field=e.field||"";
        Object.assign(d.style,{left:pc(e.x,BW),top:pc(e.y,BH),width:pc(e.w,BW),height:pc(e.h,BH),fontSize:PT2CQ(e.size)+"cqw",fontWeight:e.bold?"700":"400",fontStyle:e.italic?"italic":"normal",textAlign:e.align||"left",color:"#"+(e.color||"000000"),fontFamily:e.font==="Arial Narrow"?'"Arial Narrow","Roboto Condensed",Arial,sans-serif':"Arial,sans-serif",lineHeight:e.lineSp?(e.lineSp/e.size):1.2,display:"flex",flexDirection:"column",justifyContent:e.valign==="middle"?"center":(e.align==="center"&&e.lineSp?"center":"flex-start")});
        st.appendChild(d);}
      else if(e.t==="img"){const d=document.createElement("div");d.className="slot";d.tabIndex=0;d.dataset.slot=e.slot;d.setAttribute("role","button");
        Object.assign(d.style,{left:pc(e.x,BW),top:pc(e.y,BH),width:pc(e.w,BW),height:pc(e.h,BH)});
        fillSlot(d,e);
        d.addEventListener("click",ev=>{ if(ev.target.classList.contains("x"))return; setActive(e.slot); if(!state.imgs[e.slot]){} });
        d.addEventListener("dblclick",()=>{setActive(e.slot);document.getElementById("file").click();});
        d.addEventListener("keydown",ev=>{if(ev.key==="Enter"){setActive(e.slot);document.getElementById("file").click();}});
        d.addEventListener("dragover",ev=>{ev.preventDefault();setActive(e.slot);});
        d.addEventListener("drop",ev=>{ev.preventDefault();const f=[...ev.dataTransfer.files].find(f=>f.type.startsWith("image/"));if(f)loadFile(f,e.slot);});
        st.appendChild(d);}
    });
    wrap.appendChild(st);
    const fs=Object.entries(FIELDS).filter(([,f])=>f.slide===s.no);
    if(fs.length){const box=document.createElement("div");box.className="fields";
      fs.forEach(([k,f])=>{const fd=document.createElement("div");fd.className="field";
        fd.innerHTML=`<label for="f_${k}"><span>${f.label}</span><button class="ai" data-k="${k}" hidden>Ringkas pakai AI</button></label><textarea id="f_${k}" placeholder="${f.ph}"></textarea>`;
        const ta=fd.querySelector("textarea");ta.value=state.text[k]||"";
        ta.addEventListener("input",()=>{state.text[k]=ta.value;const el=st.querySelector(`[data-field="${k}"]`);if(el)el.textContent=ta.value;});
        ta.addEventListener("paste",ev=>ev.stopPropagation());
        fd.querySelector(".ai").addEventListener("click",()=>aiFill(k,fd.querySelector(".ai"),ta,st));
        box.appendChild(fd);});
      wrap.appendChild(box);}
    app.appendChild(wrap);
  });
  paintActive(); showAi();
}
function fillSlot(d,e){
  const n=SLOT_ORDER.indexOf(e.slot)+1;
  if(state.imgs[e.slot]){d.classList.add("filled");d.innerHTML=`<img src="${state.imgs[e.slot].src}" alt="${e.label}"><button class="x" title="Hapus gambar">×</button>`;
    d.querySelector(".x").onclick=()=>{delete state.imgs[e.slot];d.classList.remove("filled");fillSlot(d,e);};}
  else{d.classList.remove("filled");d.innerHTML=`<span class="n">${n}</span><span>${e.label}</span><span style="font-weight:400">Ctrl+V · drop · dobel-klik</span>`;}
}
function setActive(k){state.active=k;paintActive();}
function paintActive(){document.querySelectorAll(".slot").forEach(s=>s.classList.toggle("active",s.dataset.slot===state.active));}
function nextEmpty(from){const i=SLOT_ORDER.indexOf(from);for(let j=1;j<=SLOT_ORDER.length;j++){const k=SLOT_ORDER[(i+j)%SLOT_ORDER.length];if(!state.imgs[k])return k;}return null;}

function loadFile(file,slot){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{state.imgs[slot]={src:r.result,w:im.naturalWidth,h:im.naturalHeight,blob:file};
      const d=document.querySelector(`.slot[data-slot="${slot}"]`);if(d)fillSlot(d,SLOT_EL[slot]);
      const nx=nextEmpty(slot);setActive(nx);
      toast(nx?`Masuk ke ${SLOT_EL[slot].label}. Berikutnya: ${SLOT_EL[nx].label}`:"Semua gambar sudah terisi");
      if(nx){const el=document.querySelector(`.slot[data-slot="${nx}"]`);el&&el.scrollIntoView({block:"center",behavior:"smooth"});}
    };im.src=r.result;};
  r.readAsDataURL(file);
}
document.addEventListener("paste",ev=>{
  const it=[...(ev.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));
  if(!it)return; ev.preventDefault();
  const slot=state.active||SLOT_ORDER.find(k=>!state.imgs[k])||SLOT_ORDER[0];
  loadFile(it.getAsFile(),slot);
});
document.getElementById("file").addEventListener("change",ev=>{const f=ev.target.files[0];if(f&&state.active)loadFile(f,state.active);ev.target.value="";});
document.getElementById("stretch").addEventListener("change",e=>document.querySelectorAll(".stage").forEach(s=>s.classList.toggle("stretch",e.target.checked)));
tgl.addEventListener("change",()=>document.querySelectorAll('[data-field="date"]').forEach(d=>d.textContent=fmtDate(tgl.value)));
document.getElementById("reset").addEventListener("click",()=>{if(!confirm("Kosongkan semua gambar dan teks?"))return;state.imgs={};state.text={};state.active=SLOT_ORDER[0];render();});

/* ---------- AI ringkasan (opsional, hanya jika tersedia) ---------- */
let SAMPLE=null;
async function showAi(){ if(!SAMPLE) return; document.querySelectorAll(".ai").forEach(b=>b.hidden=false); }
(async()=>{ try{ if(!window.claude?.use) return; const s=await claude.use("sample"); if(!s) return;
  const lim=await s.limits().catch(()=>null); if(!lim?.images) return; SAMPLE=s; showAi(); }catch(e){} })();
async function aiFill(k,btn,ta,st){
  const f=FIELDS[k]; const blobs=f.slots.map(s=>state.imgs[s]?.blob).filter(Boolean);
  if(!blobs.length){toast("Paste dulu gambarnya");return;}
  btn.disabled=true;const old=btn.textContent;btn.textContent="Membaca gambar…";
  const prompt=`Kamu analis operasional gudang DC AHI Sidoarjo (Kawan Lama Group). Lihat screenshot dashboard terlampir. ${f.ask}
Aturan: Bahasa Indonesia, singkat & padat, pakai angka dari gambar apa adanya (jangan mengarang). ${k.endsWith("note")?"Tulis sebagai 1 paragraf pendek tanpa bullet.":"Tulis tiap poin di baris baru diawali '- '."} Balas hanya teks ringkasannya, tanpa judul atau pembuka.`;
  try{ const r=await SAMPLE(prompt,{images:blobs,modelTier:"default",onText:({text})=>{ta.value=text;}});
    ta.value=r.text.trim(); }
  catch(e){ if(e?.text) ta.value=e.text; toast(e?.code==="rate_limited"?"AI sedang sibuk, coba lagi sebentar":"AI tidak tersedia saat ini"); }
  state.text[k]=ta.value; const el=st.querySelector(`[data-field="${k}"]`); if(el) el.textContent=ta.value;
  btn.disabled=false;btn.textContent=old;
}

/* ---------- Generate PPT ---------- */
function dataOf(src){return src.replace(/^data:/,"");}
function runs(txt,size){
  const lines=txt.replace(/\r/g,"").split("\n").filter((l,i,a)=>!(l.trim()===""&&(i===0||i===a.length-1)));
  return lines.map((l,i)=>{const m=l.match(/^\s*[-•*]\s+(.*)$/);const o={fontSize:size,breakLine:i<lines.length-1,paraSpaceAfter:3};
    if(m)o.bullet={indent:12};return {text:m?m[1]:l,options:o};});
}
async function generate(){
  if(typeof PptxGenJS==="undefined"){toast("Library PPT belum termuat, cek koneksi");return;}
  const btn=document.getElementById("gen");btn.disabled=true;btn.textContent="Membuat…";
  try{
    const pres=new PptxGenJS(); pres.layout="LAYOUT_WIDE"; pres.title="Planner Presentation Daily";
    const stretch=document.getElementById("stretch").checked;
    for(const s of SLIDES){
      const sl=pres.addSlide(); sl.background={data:dataOf(ASSET[s.bg])};
      for(const e of s.els){
        if(e.t==="logo") sl.addImage({data:dataOf(ASSET.logo),x:px(e.x),y:pyy(e.y),w:px(e.w),h:pyy(e.h)});
        else if(e.t==="rect") sl.addShape(pres.ShapeType.rect,{x:px(e.x),y:pyy(e.y),w:px(e.w),h:pyy(e.h),fill:{color:e.fill},line:{color:e.fill,width:0}});
        else if(e.t==="panel") sl.addShape(pres.ShapeType.roundRect,{x:px(e.x),y:pyy(e.y),w:px(e.w),h:pyy(e.h),rectRadius:0.12,fill:{color:e.fill},line:{color:e.line,width:0.75},shadow:{type:"outer",color:"000000",opacity:0.3,blur:4,offset:2,angle:90}});
        else if(e.t==="line"){const o={x:px(Math.min(e.x1,e.x2)),y:pyy(Math.min(e.y1,e.y2)),w:px(Math.abs(e.x2-e.x1)),h:pyy(Math.abs(e.y2-e.y1)),line:{color:e.color,width:e.w}};
          if(e.dash)o.line.dashType=e.dash; if(e.arrow)o.line.endArrowType="triangle"; sl.addShape(pres.ShapeType.line,o);}
        else if(e.t==="text"){
          const txt=e.field?(e.field==="date"?fmtDate(tgl.value):(state.text[e.field]||"")):e.text;
          if(!txt.trim()) continue;
          const base={x:px(e.x),y:pyy(e.y),w:px(e.w),h:pyy(e.h),fontFace:e.font||"Arial",fontSize:e.size,bold:!!e.bold,italic:!!e.italic,color:e.color||"000000",align:e.align||"left",valign:e.valign||(e.lineSp?"middle":"top"),margin:0,isTextBox:true};
          if(e.lineSp) base.lineSpacing=e.lineSp;
          if(e.field&&e.field!=="date") sl.addText(runs(txt,e.size),{...base,fit:"shrink"});
          else sl.addText(txt,base);
        }
        else if(e.t==="img"){
          const im=state.imgs[e.slot]; if(!im) continue;
          let x=px(e.x),y=pyy(e.y),w=px(e.w),h=pyy(e.h);
          if(!stretch){const r=Math.min(w/im.w,h/im.h);const nw=im.w*r,nh=im.h*r;x+=(w-nw)/2;y+=(h-nh)/2;w=nw;h=nh;}
          const o={data:dataOf(im.src),x:+x.toFixed(4),y:+y.toFixed(4),w:+w.toFixed(4),h:+h.toFixed(4)};
          if(e.shadow)o.shadow={type:"outer",color:"000000",opacity:0.35,blur:5,offset:3,angle:90};
          sl.addImage(o);
        }
      }
    }
    const name=`Planner_Presentation_Daily_${fmtDate(tgl.value).replace(/ /g,"_")}.pptx`;
    const dl=await DLP;
    if(dl){const blob=await pres.write({outputType:"blob"});
      try{await dl.save({filename:name,data:blob});toast("PPT tersimpan");}
      catch(err){toast(err?.code==="declined"?"Download dibatalkan":"Gagal menyimpan: "+(err?.code||"error"));}}
    else{await pres.writeFile({fileName:name});toast("PPT terunduh");}
  }catch(err){console.error(err);toast("Gagal membuat PPT");}
  btn.disabled=false;btn.textContent="Generate PPT";
}
document.getElementById("gen").addEventListener("click",generate);

const DLP=window.claude?.use?claude.use("downloads").catch(()=>null):Promise.resolve(null);
state.active=SLOT_ORDER[0];
render();
</script>
